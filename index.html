<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>タロット占い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<header class="app-header">
  <h1 id="app-title" class="app-title" role="button" tabindex="0">タロット占い</h1>
  <button id="btn-history" class="icon-btn" aria-label="履歴">📜</button>
</header>

<main>

  <section id="screen-deck" class="screen">
    <h2>デッキを選ぶ</h2>
    <p class="hint">使うカードの範囲を選んでね</p>
    <div class="deck-options">
      <button class="deck-option" data-deck="full">フルデッキ<br><span>78枚</span></button>
      <button class="deck-option" data-deck="major">大アルカナのみ<br><span>22枚</span></button>
      <button class="deck-option" data-deck="minor">小アルカナのみ<br><span>56枚</span></button>
      <button class="deck-option" data-deck="court">コートカードのみ<br><span>16枚</span></button>
    </div>
  </section>

  <section id="screen-spread" class="screen" hidden>
    <button class="back-btn" data-back="screen-deck">← デッキ選択に戻る</button>
    <h2>スプレッドを選ぶ</h2>
    <p class="hint">展開したいスプレッドを選んでね</p>
    <div id="spread-list" class="spread-list"></div>
    <button id="btn-new-spread" class="secondary-btn">＋ 新しいスプレッドを作る</button>
  </section>

  <section id="screen-builder" class="screen" hidden>
    <button class="back-btn" data-back="screen-spread">← スプレッド選択に戻る</button>
    <h2>オリジナルスプレッド作成</h2>
    <p class="hint">「位置を追加」して、カードをドラッグで並べてね</p>
    <input type="text" id="builder-name" class="builder-name-input" placeholder="スプレッドの名前(例：わたし専用リーディング)">
    <div class="builder-canvas-wrap">
      <div id="builder-canvas" class="builder-canvas"></div>
    </div>
    <button id="btn-add-position" class="secondary-btn">＋ 位置を追加</button>

    <div id="builder-edit-panel" class="builder-edit-panel" hidden>
      <label class="builder-field">
        ラベル
        <input type="text" id="builder-position-label" placeholder="例：現在">
      </label>
      <label class="builder-rotate-label">
        <input type="checkbox" id="builder-position-rotate"> 90度回転して置く
      </label>
      <button id="btn-delete-position" class="builder-delete-btn">この位置を削除</button>
    </div>

    <button id="btn-save-spread" class="primary-btn">このスプレッドを保存</button>
  </section>

  <section id="screen-shuffle" class="screen shuffle-screen" hidden>
    <button class="back-btn" data-back="screen-spread">← スプレッド選択に戻る</button>
    <div id="shuffle-intro">
      <label class="shuffle-question-label" for="shuffle-question">占いたいこと</label>
      <textarea id="shuffle-question" class="shuffle-question-input" maxlength="200" rows="2" placeholder="例：転職するか、今の仕事を続けるか迷っている"></textarea>
      <input type="text" id="shuffle-title-input" class="shuffle-title-input" maxlength="40">
      <p class="hint" id="shuffle-hint"></p>
      <button id="btn-start-mix" class="primary-btn">カードをかき混ぜる →</button>
    </div>

    <div id="mix-phase" class="mix-phase" hidden>
      <div id="mix-area" class="mix-area"></div>
      <p class="shuffle-instruction" id="shuffle-instruction">画面を指やマウスでなぞってシャッフルしよう</p>
      <div class="shuffle-progress" id="shuffle-progress"><div id="shuffle-progress-fill" class="shuffle-progress-fill"></div></div>
      <button id="btn-mix-done" class="primary-btn" disabled>次へ →</button>
    </div>
  </section>

  <section id="screen-reveal" class="screen" hidden>
    <button class="back-btn" data-back="screen-spread">← やり直す</button>
    <h2 id="reveal-title"></h2>
    <p class="hint">カードをタップして開こう</p>
    <div class="spread-canvas-scroll">
      <div id="spread-canvas" class="spread-canvas"></div>
    </div>
    <button id="btn-to-result" class="primary-btn" hidden>結果をまとめる</button>
  </section>

  <section id="screen-result" class="screen result-screen" hidden>
    <button class="back-btn" data-back="screen-reveal">← カード表示に戻る</button>
    <h2>鑑定結果</h2>
    <div id="result-view" class="result-view"></div>
    <div class="result-actions">
      <button id="btn-copy">📋 コピー</button>
      <button id="btn-save-history">💾 履歴に保存</button>
      <button id="btn-new-reading">🔄 もう一度</button>
    </div>
  </section>

  <section id="screen-history" class="screen" hidden>
    <button class="back-btn" data-back="screen-deck">← 戻る</button>
    <h2>鑑定履歴</h2>
    <div id="history-list" class="history-list"></div>
  </section>

</main>

<div id="card-modal" class="modal" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-content">
    <button class="modal-close" data-close-modal>×</button>
    <img id="modal-img" src="" alt="">
    <h3 id="modal-name"></h3>
    <p id="modal-orientation-label"></p>
    <p id="modal-short"></p>
    <button id="modal-more-toggle">もっと見る ▾</button>
    <div id="modal-body" class="modal-body" hidden></div>
  </div>
</div>

<script src="data/cards.js?v=1"></script>
<script src="data/spreads.js?v=3"></script>
<script src="app.js?v=14"></script>
</body>
</html>
